services:
  - type: web
    name: henosis
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: henosis-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: henosis4india@gmail.com
      - key: ADMIN_PASSWORD_HASH
        value: 8c9e8e6cde5bc44c7eb8e14e71d24e0e0b7e8e7f9e8e7f9e8e7f9e8e7f9e8e7

databases:
  - name: henosis-db
    databaseName: henosis
    user: henosis
    plan: free
