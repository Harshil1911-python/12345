services:
  - type: web
    name: henosis
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: henosis-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: henosis4india@gmail.com

databases:
  - name: henosis-db
    databaseName: henosis
    user: henosis_user
    plan: free
