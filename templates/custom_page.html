{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ settings.get('logo_text','HENOSIS') }}{% endblock %}
{% block content %}
<section class="section" style="padding-top:60px;">
  <div class="container" style="max-width:860px;">
    <div class="breadcrumb reveal">
      <a href="{{ url_for('index') }}">Home</a>
      <span class="breadcrumb-sep">·</span>
      <span>{{ page.title }}</span>
    </div>
    <h1 style="margin-bottom:40px;" class="reveal">{{ page.title }}</h1>
    <div class="reveal" style="font-size:.95rem;line-height:1.9;color:var(--gray-dark);">
      {{ page.content|safe }}
    </div>
  </div>
</section>
{% endblock %}
