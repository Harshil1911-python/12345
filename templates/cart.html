{% extends "base.html" %}
{% block title %}Your Selection — {{ settings.get('logo_text','HENOSIS') }}{% endblock %}
{% block content %}
<section class="section" style="padding-top:60px;min-height:70vh;">
  <div class="container" style="max-width:900px;">
    <div style="margin-bottom:48px;" class="reveal">
      <span class="label">Your Selection</span>
      <h2 style="margin-top:12px;">Shopping Cart</h2>
    </div>
    <div id="cartPageContent"></div>
  </div>
</section>
{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('cartPageContent');
  if (!container) return;
  if (cart.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:60px 0;">
        <div style="width:64px;height:64px;border:1px solid var(--beige);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--beige);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        </div>
        <h3 style="font-family:var(--font-display);font-size:1.5rem;margin-bottom:12px;">Your cart is empty</h3>
        <p style="font-size:.88rem;color:var(--gray-mid);margin-bottom:32px;">Discover pieces that speak to you.</p>
        <a href="/shop" class="btn btn-gold">Explore Collection</a>
      </div>`;
    return;
  }
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  container.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:start;">
      <div>
        <div style="border-top:1px solid var(--beige);">
          ${cart.map(item=>`
            <div style="display:flex;gap:20px;padding:24px 0;border-bottom:1px solid var(--beige);align-items:center;">
              <div style="width:90px;height:90px;flex-shrink:0;background:var(--cream);border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center;">
                ${item.imgId?`<img src="/pimg/${item.imgId}" style="width:100%;height:100%;object-fit:cover;"/>`:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="color:var(--beige)"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`}
              </div>
              <div style="flex:1;">
                <div style="font-family:var(--font-display);font-size:1.05rem;margin-bottom:5px;">${item.name}</div>
                <div style="color:var(--gold);font-size:.85rem;font-weight:500;">₹${(item.price*item.qty).toLocaleString('en-IN')}</div>
                ${item.onlyOne?`<div style="font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--champagne);margin-top:4px;">One of a kind</div>`:`
                <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
                  <button onclick="changeQty('${item.id}',-1);location.reload()" style="width:26px;height:26px;border:1px solid var(--beige);background:none;cursor:pointer;font-size:1rem;">−</button>
                  <span style="font-size:.88rem;">${item.qty}</span>
                  <button onclick="changeQty('${item.id}',1);location.reload()" style="width:26px;height:26px;border:1px solid var(--beige);background:none;cursor:pointer;font-size:1rem;">+</button>
                </div>`}
              </div>
              <button onclick="removeFromCart('${item.id}');location.reload()" style="font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-light);border:none;background:none;cursor:pointer;transition:color .2s;" onmouseover="this.style.color='var(--charcoal)'" onmouseout="this.style.color='var(--gray-light)'">Remove</button>
            </div>`).join('')}
        </div>
        <div style="margin-top:20px;">
          <a href="/shop" style="font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-mid);">← Continue Shopping</a>
        </div>
      </div>
      <div style="background:var(--cream);padding:32px;border-radius:2px;position:sticky;top:100px;">
        <h3 style="font-family:var(--font-display);font-size:1.3rem;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--beige);">Order Summary</h3>
        ${cart.map(i=>`<div style="display:flex;justify-content:space-between;font-size:.82rem;padding:8px 0;border-bottom:1px solid var(--beige);"><span>${i.name} <span style="color:var(--gray-light)">×${i.qty}</span></span><span style="color:var(--gold);">₹${(i.price*i.qty).toLocaleString('en-IN')}</span></div>`).join('')}
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-top:4px;">
          <span style="font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;">Total</span>
          <span style="font-family:var(--font-display);font-size:1.5rem;color:var(--gold);">₹${total.toLocaleString('en-IN')}</span>
        </div>
        <div style="font-size:.72rem;color:var(--gray-mid);margin-top:12px;margin-bottom:18px;">Shipping & payment confirmed after order placement.</div>
        <a href="/checkout" class="btn btn-gold btn-full" style="text-align:center;display:block;">Proceed to Checkout</a>
      </div>
    </div>`;
});
</script>
{% endblock %}
{% endblock %}
