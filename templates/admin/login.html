<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — HENOSIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --ivory:#faf8f4;--cream:#f5f0e8;--beige:#e8ddd0;--champagne:#c9a96e;--gold:#b8965a;--black:#0e0e0e;--charcoal:#1a1a1a;--gray-mid:#6b6360; }
    *, *::before, *::after { box-sizing:border-box;margin:0;padding:0; }
    body { font-family:'Raleway',sans-serif;background:var(--charcoal);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px; }
    .login-wrap {
      width:100%;max-width:420px;
      background:var(--ivory);padding:48px 40px;
      position:relative;overflow:hidden;
    }
    .login-wrap::before {
      content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;
      border-radius:50%;border:1px solid rgba(201,169,110,.12);
    }
    .login-logo { font-family:'Cormorant Garamond',serif;font-size:1.8rem;letter-spacing:.2em;color:var(--charcoal);margin-bottom:6px; }
    .login-sub { font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--champagne);margin-bottom:40px; }
    h2 { font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;margin-bottom:28px;color:var(--charcoal); }
    .form-group { margin-bottom:18px; }
    label { display:block;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gray-mid);margin-bottom:8px; }
    input { width:100%;padding:12px 14px;border:1px solid var(--beige);background:var(--cream);font-family:'Raleway',sans-serif;font-size:.88rem;color:var(--charcoal);outline:none;transition:border-color .2s;border-radius:2px; }
    input:focus { border-color:var(--gold); }
    .btn { width:100%;padding:14px;background:var(--charcoal);color:var(--ivory);font-family:'Raleway',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border:none;cursor:pointer;margin-top:8px;transition:background .25s;border-radius:2px; }
    .btn:hover { background:var(--black); }
    .alert { padding:10px 16px;background:#fde8e8;color:#c44;border-left:2px solid #c44;font-size:.8rem;margin-bottom:20px;border-radius:2px; }
    .login-hint { font-size:.7rem;color:var(--gray-mid);text-align:center;margin-top:24px;line-height:1.6; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">HENOSIS</div>
    <div class="login-sub">Admin Access</div>
    <h2>Sign In</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat, msg in messages %}
        <div class="alert">{{ msg }}</div>
      {% endfor %}{% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required autocomplete="email" placeholder="admin@henosis.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••"/>
      </div>
      <button type="submit" class="btn">Access Dashboard</button>
    </form>
    <p class="login-hint">This page is private. Unauthorized access is prohibited.</p>
  </div>
</body>
</html>
