{% extends "admin/base.html" %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div style="max-width:480px;">
  <div class="card">
    <div class="card-title">Change Admin Password</div>
    <p style="font-size:.78rem;color:var(--gray-mid);margin-bottom:24px;line-height:1.7;">
      After changing your password, update the <code style="background:var(--cream);padding:2px 6px;border-radius:2px;">ADMIN_PASSWORD_HASH</code> environment variable on Render with the new SHA-256 hash to persist across deploys.
    </p>
    <form method="POST">
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="current" required autocomplete="current-password"/>
      </div>
      <div class="form-group">
        <label>New Password (min 8 characters)</label>
        <input type="password" name="new_password" required minlength="8" autocomplete="new-password"/>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm" required autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn btn-gold">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
